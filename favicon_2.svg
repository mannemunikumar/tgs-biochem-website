<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <!-- Leaf & Outer Arc Green/Orange Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70bc23"/>
      <stop offset="50%" stop-color="#0e7835"/>
      <stop offset="85%" stop-color="#ef7d00"/>
      <stop offset="100%" stop-color="#f9a01b"/>
    </linearGradient>

    <!-- Lower Leaf Green Gradient -->
    <linearGradient id="darkLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#449e2b"/>
      <stop offset="100%" stop-color="#085a26"/>
    </linearGradient>

    <!-- Liquid Gradient for Flask & Test Tube -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84c324"/>
      <stop offset="50%" stop-color="#f9a01b"/>
      <stop offset="100%" stop-color="#ee4400"/>
    </linearGradient>

    <!-- Main Lettering Gradient -->
    <linearGradient id="greenTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b7a37"/>
      <stop offset="100%" stop-color="#024d20"/>
    </linearGradient>

    <!-- Blue Chromatogram Trace Gradient -->
    <linearGradient id="blueLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#083887"/>
      <stop offset="100%" stop-color="#195bbd"/>
    </linearGradient>
  </defs>

  <style>
    .tgs-text {
      font-family: 'Montserrat', 'Arial Black', sans-serif;
      font-size: 42px;
      font-weight: 900;
      fill: #083b8a;
      letter-spacing: 1px;
    }
    .brand-title {
      font-family: 'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif;
      font-size: 148px;
      font-weight: 900;
      fill: url(#greenTextGrad);
    }
    .sub-title {
      font-family: 'Montserrat', 'Arial Black', sans-serif;
      font-size: 58px;
      font-weight: 900;
      fill: #222325;
      letter-spacing: -0.5px;
    }
  </style>

  <!-- ==================== LEFT ICON EMBLEM ==================== -->
  <g transform="translate(10, 0)">
    <!-- Main lowercase 'b' curved outer body -->
    <path d="M 125,120 
             C 125,105 150,105 150,120 
             L 150,225 
             C 195,190 240,210 245,260 
             C 252,315 205,370 145,370 
             C 75,370 40,310 40,240 
             C 40,165 85,125 125,120 Z" 
          fill="url(#leafGrad)" />

    <!-- Negative Space Cutout inside 'b' -->
    <path d="M 150,250 
             C 150,230 170,220 185,235 
             C 205,255 200,295 180,310 
             C 160,325 150,310 150,290 Z" 
          fill="#ffffff" />

    <!-- Dispersed Biological Dot Array -->
    <g fill="#f7941d">
      <circle cx="195" cy="180" r="4.5" />
      <circle cx="208" cy="170" r="5" />
      <circle cx="218" cy="185" r="4" />
      <circle cx="225" cy="172" r="5.5" />
      <circle cx="238" cy="188" r="4.5" />
      <circle cx="242" cy="175" r="5" />
      <circle cx="250" cy="195" r="4" />
      <circle cx="255" cy="183" r="5" />
      <circle cx="248" cy="215" r="4.5" />
      <circle cx="260" cy="208" r="5" />
      <circle cx="254" cy="235" r="4" />
      <circle cx="262" cy="225" r="4.5" />
      <circle cx="248" cy="255" r="3.5" />
    </g>

    <!-- Side Leaf Overlay -->
    <g>
      <!-- Leaf 1 (Top Left) -->
      <path d="M 45,240 
               C 40,200 85,200 115,260 
               C 85,280 50,270 45,240 Z" 
            fill="#5eb827" />
      <path d="M 50,242 Q 80,240 112,258" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 70,241 Q 78,232 86,230" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <path d="M 85,246 Q 95,240 102,238" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <path d="M 72,247 Q 78,256 86,260" stroke="#ffffff" stroke-width="1.5" fill="none"/>

      <!-- Leaf 2 (Bottom Left Base) -->
      <path d="M 50,275 
               C 50,250 110,245 155,325 
               C 105,345 55,335 50,275 Z" 
            fill="url(#darkLeafGrad)" />
      <path d="M 55,280 Q 100,285 150,322" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 85,286 Q 100,270 115,268" stroke="#ffffff" stroke-width="2" fill="none"/>
      <path d="M 115,296 Q 130,285 142,282" stroke="#ffffff" stroke-width="2" fill="none"/>
      <path d="M 85,293 Q 102,310 115,320" stroke="#ffffff" stroke-width="2" fill="none"/>
    </g>

    <!-- Analytical Flask -->
    <g transform="translate(15, 8)">
      <!-- Flask Outline -->
      <path d="M 143,212 L 157,212 
               L 157,235 L 175,280 
               A 12,12 0 0,1 165,296 
               L 135,296 
               A 12,12 0 0,1 125,280 
               L 143,235 Z" 
            fill="#ffffff" stroke="#0e6b30" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Flask Lip -->
      <rect x="140" y="208" width="20" height="5" rx="2" fill="#0e6b30" />
      
      <!-- Liquid in Flask -->
      <path d="M 132,272 L 168,272 L 165,288 C 164,292 160,293 156,293 L 144,293 C 140,293 136,292 135,288 Z" 
            fill="url(#liquidGrad)" />
      
      <!-- Bubbles -->
      <circle cx="150" cy="282" r="2.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="158" cy="277" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="143" cy="285" r="2" fill="#ffffff" opacity="0.8"/>
      <circle cx="149" cy="255" r="2" fill="#70bc23"/>
      <circle cx="152" cy="242" r="2.5" fill="#70bc23"/>
    </g>
  </g>

  <!-- ==================== CHROMATOGRAPHY PEAKS & BASELINE ==================== -->
  <path d="M 120,345 
           C 200,345 220,345 235,345 
           L 270,345 
           Q 282,345 285,320 
           L 290,110 
           Q 292,95 295,110 
           L 300,345 
           L 310,345 
           Q 318,345 320,300 
           L 326,240 
           Q 330,225 334,240 
           L 340,345 
           L 460,345" 
        fill="none" 
        stroke="url(#blueLineGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- ==================== TYPOGRAPHY & LOGO CORE ==================== -->

  <!-- Top Acronym "TGS" -->
  <text x="390" y="145" class="tgs-text">TGS</text>

  <!-- Main Wordmark "Biochem" -->
  <g transform="translate(0, 0)">
    <!-- Letter 'B' -->
    <text x="388" y="278" class="brand-title">B</text>

    <!-- Test Tube Letter 'i' Replacement -->
    <g transform="translate(533, 138)">
      <!-- Molecule / Atom Nodes above 'i' -->
      <!-- Center node -->
      <circle cx="15" cy="30" r="14" fill="#67ad25" />
      <!-- Top right node -->
      <circle cx="48" cy="10" r="12" fill="#589e1b" />
      <!-- Bottom right node -->
      <circle cx="44" cy="50" r="10" fill="#4d8c16" />
      <!-- Molecule Bonds (Sticks) -->
      <line x1="15" y1="30" x2="48" y2="10" stroke="#095526" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="15" y1="30" x2="44" y2="50" stroke="#095526" stroke-width="4" stroke-linecap="round"/>

      <!-- Test Tube Body (Stem of 'i') -->
      <path d="M 0,65 L 30,65 
               L 30,120 
               C 30,135 0,135 0,120 Z" 
            fill="#ffffff" stroke="#095526" stroke-width="5.5" stroke-linejoin="round" />
      <!-- Test Tube Lip -->
      <rect x="-4" y="60" width="38" height="6" rx="3" fill="#095526" />

      <!-- Chemical Fluid inside Test Tube -->
      <path d="M 3,85 L 27,85 
               L 27,118 
               C 27,130 3,130 3,118 Z" 
            fill="url(#liquidGrad)" />

      <!-- Rising Fluid Bubbles -->
      <circle cx="11" cy="115" r="2.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="20" cy="105" r="2" fill="#ffffff" opacity="0.9"/>
      <circle cx="12" cy="95" r="2.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="19" cy="90" r="1.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Letters "ochem" -->
    <text x="578" y="278" class="brand-title" letter-spacing="-2px">ochem</text>
  </g>

  <!-- ==================== BASELINE & SUBTITLE ==================== -->
  <!-- "Analytical Labs" Sub-headline -->
  <text x="480" y="358" class="sub-title">Analytical Labs</text>

  <!-- Right Trailing Blue Line Accent -->
  <line x1="995" y1="345" x2="1075" y2="345" stroke="#195bbd" stroke-width="5" stroke-linecap="round" />
</svg>
